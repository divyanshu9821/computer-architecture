<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hack Assembler</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: sans-serif;
        }

        body {
            margin: 0;
            height: 100vh;
        }

        .wrapper{
            display: flex;
            height: 100%;
            flex-direction: column;
        }

        .container {
            display: flex;
            flex:1;
            width: 100%;
            padding: 10px;
            gap: 10px;
        }

        .left {
            resize: none;
            outline: 1px solid;
        }

        .right,
        .left {
            border: 1px solid;
            flex: 1;
            height: 100%;
            padding: 10px;
            font-size: 1rem;
            font-family: monospace;
        }

        .right {
            overflow: auto;
            background-color: rgb(240, 240, 240);
            color: rgb(50,50,50);
        }

        .button{
            display: flex;
            justify-content: center;
            padding: 10px;
            padding-top: 0px;
        }
    </style>
</head>

<body>
    <div class="wrapper">
        <div class="container">
            <textarea class="left" id="editor"></textarea>
            <div class="right" id="output"></div>
        </div>
        <div class="button">
            <button id="translate">Translate</button>
        </div>
    </div>

    <script type="module">
        import { translate } from './assembler.js'

        const $ = s => document.querySelector(s)

        $('#translate').addEventListener('click', _ => {
            $('#output').innerHTML = translate($('#editor').value)
        })
    </script>
</body>

</html>
